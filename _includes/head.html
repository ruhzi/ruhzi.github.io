<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{% seo %}
{% if page.layout == "paper" %}
<meta name="citation_title" content="{{ page.title | escape }}">
{% for a in page.authors %}<meta name="citation_author" content="{{ a | escape }}">
{% endfor %}<meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
<meta name="citation_pdf_url" content="{{ page.pdf | absolute_url }}">
<meta name="citation_abstract_html_url" content="{{ page.url | absolute_url }}">
{% if page.doi and page.doi != "" %}<meta name="citation_doi" content="{{ page.doi }}">
{% endif %}{% endif %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
{% if page.math or layout.math %}
<script>
  window.MathJax = { tex: { inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$'], ['\\[','\\]']], tags: 'ams' }, options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] } };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
{% endif %}
