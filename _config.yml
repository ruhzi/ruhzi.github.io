title: ruhzi
tagline: 
description: >-
  enthusiast
author:
  name: Ruhaan Chopra
url: https://ruhzi.github.io
baseurl: ""
lang: en
timezone: Asia/Kolkata

permalink: /:year/:title/
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  footnote_backlink: "&#8617;"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, comments: false }
  # Archived versions stay downloadable but out of the sitemap, so only the latest PDF is indexed.
  - scope: { path: "papers/*-v*.pdf" }
    values: { sitemap: false }

exclude: [README.md, Gemfile, Gemfile.lock, vendor, node_modules]
