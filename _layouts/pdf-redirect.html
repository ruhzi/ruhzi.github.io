<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  <link rel="canonical" href="{{ page.pdf | absolute_url }}">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ page.pdf | relative_url }}">
</head>
<body>
  <p>Redirecting to <a href="{{ page.pdf | relative_url }}">{{ page.title }} (PDF)</a>.</p>
</body>
</html>
